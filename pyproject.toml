[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiftguard-its"
version = "0.1.0"
description = "Risk-controlled traffic forecasting under regime shift and sensor outage"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.12,<2",
  "scikit-learn>=1.4,<2",
  "pyyaml>=6,<7",
  "tqdm>=4.66,<5",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
train = ["torch>=2.6,<3", "tensorboard>=2.16,<3"]
test = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
